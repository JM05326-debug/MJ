name: Daily predict

on:
  schedule:
    # 6x/day, Taipei/Tokyo local times below. Doesn't depend on any local
    # machine being on — see the CPBL fetch step comment further down.
    #
    # GitHub's own scheduled-workflow cron can silently not fire for a given
    # slot during infra load (documented GitHub behavior, not a config bug —
    # confirmed happening here: two consecutive slots, 21:15 and the next
    # day's 09:15 Taipei, both never produced a run). Every step this
    # workflow runs is idempotent/safe to re-run (fetchers overwrite from
    # scratch, lock_predictions.py only ever appends newly-eligible games),
    # so the practical mitigation is a denser schedule: the four times below
    # are unchanged from before, plus two more added to break up the
    # 21:15->09:15 overnight gap (previously 12h with zero slots in it, now
    # at most ~6h between any two consecutive slots) so a single missed
    # trigger no longer leaves the dashboard stale for most of a day.
    # 19:15 UTC (previous day) ~= 03:15 Taipei / 04:15 Tokyo
    - cron: '15 19 * * *'
    # 01:15 UTC ~= 09:15 Taipei / 10:15 Tokyo
    - cron: '15 1 * * *'
    # 04:45 UTC ~= 12:45 Taipei / 13:45 Tokyo
    - cron: '45 4 * * *'
    # 08:15 UTC ~= 16:15 Taipei / 17:15 Tokyo
    - cron: '15 8 * * *'
    # 10:15 UTC ~= 18:15 Taipei / 19:15 Tokyo
    - cron: '15 10 * * *'
    # 13:15 UTC ~= 21:15 Taipei / 22:15 Tokyo
    - cron: '15 13 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-predict
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      # CPBL used to require a local Windows Task Scheduler job because
      # www.cpbl.com.tw blocks GitHub Actions' published IP ranges
      # (confirmed: 404 on every CPBL endpoint from this runner). Rebas
      # 野球革命 (rebas.tw) — a different domain, not on that blocklist —
      # publishes the same schedule/player data via a public JSON API, so
      # CPBL fetching moved here alongside NPB; see scripts/fetch_cpbl.py
      # and scripts/fetch_cpbl_players.py for the endpoints used.
      #
      # Each fetcher below is independent and best-effort: a failure must
      # not block the others, and must never touch that source's existing
      # data/*.json — the fetcher only writes via a single json.dump() at
      # the very end of main(), so an exception mid-run leaves the prior
      # file untouched on disk automatically. fetch_cpbl_players.py reads
      # the schedule fetch_cpbl.py just wrote (for starting-pitcher/role
      # lookups), so it has to run after it.
      - name: Fetch CPBL schedule
        run: python scripts/fetch_cpbl.py
        continue-on-error: true
      - name: Fetch CPBL player stats
        run: python scripts/fetch_cpbl_players.py
        continue-on-error: true
      - name: Fetch CPBL odds (best-effort)
        run: python scripts/fetch_cpbl_odds.py
        continue-on-error: true
      - name: Fetch NPB schedule
        run: python scripts/fetch_npb.py
        continue-on-error: true
      - name: Fetch NPB player stats
        run: python scripts/fetch_npb_players.py
        continue-on-error: true

      # Locking is NOT best-effort in the same sense — a game_id, once
      # written, is never revisited, so this only locks games for a league
      # whose data is actually present and fresh enough this run (see
      # lock_predictions.py's own FileNotFoundError handling for the
      # degenerate case where a data file has never existed at all).
      - name: Lock today's predictions
        run: python pipeline/lock_predictions.py

      - name: Build full site + dashboard
        if: always()
        run: |
          python scripts/generate_site.py
          python pipeline/build_dashboard.py

      - name: Commit and push
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ predictions/ site/ docs/
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "daily predict: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase
            git push
          fi
