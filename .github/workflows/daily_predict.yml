name: Daily predict

on:
  schedule:
    # 01:30 UTC ~= 09:30 Taipei / 10:30 Tokyo (morning pass)
    - cron: '30 1 * * *'
    # 06:30 UTC ~= 14:30 Taipei / 15:30 Tokyo (afternoon, most starters announced by now)
    - cron: '30 6 * * *'
    # 08:45 UTC ~= 16:45 Taipei / 17:45 Tokyo (final pass before typical evening first pitch)
    - cron: '45 8 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-predict
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      # Each fetcher is independent and best-effort here: a failure in one
      # (site markup change, transient network error) must not block the
      # others, and must never touch that source's existing data/*.json —
      # both fetchers only write via a single json.dump() at the very end
      # of main(), so an exception mid-run leaves the prior file untouched
      # on disk automatically.
      - name: Fetch CPBL schedule
        run: python scripts/fetch_cpbl.py
        continue-on-error: true
      - name: Fetch CPBL player stats
        run: python scripts/fetch_cpbl_players.py
        continue-on-error: true
      - name: Fetch CPBL odds (best-effort)
        run: python scripts/fetch_cpbl_odds.py
        continue-on-error: true
      - name: Fetch NPB schedule
        run: python scripts/fetch_npb.py
        continue-on-error: true
      - name: Fetch NPB player stats
        run: python scripts/fetch_npb_players.py
        continue-on-error: true

      # Locking is NOT best-effort in the same sense — a game_id, once
      # written, is never revisited, so this only locks games for a league
      # whose fetch actually produced fresh data this run (see
      # lock_predictions.py's own FileNotFoundError handling for the
      # degenerate case where a data file has never existed at all).
      - name: Lock today's predictions
        run: python pipeline/lock_predictions.py

      - name: Build full site + dashboard
        if: always()
        run: |
          python scripts/generate_site.py
          python pipeline/build_dashboard.py

      - name: Commit and push
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ predictions/ site/ docs/
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "daily predict: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase
            git push
          fi
