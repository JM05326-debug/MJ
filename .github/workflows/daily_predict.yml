name: Daily predict

on:
  schedule:
    # Timed 15min after the local CPBL update task (see scripts/update_cpbl_and_push.bat
    # + README, tasks CPBL_Update_1-4 at 09:00/16:00/18:00/21:00 Taipei) so this run
    # picks up freshly-pushed CPBL data rather than racing it — CPBL's own site blocks
    # GitHub Actions' published IP ranges, so that half of the fetch has to run from
    # the user's machine; everything else here is unaffected.
    # 01:15 UTC ~= 09:15 Taipei / 10:15 Tokyo
    - cron: '15 1 * * *'
    # 08:15 UTC ~= 16:15 Taipei / 17:15 Tokyo
    - cron: '15 8 * * *'
    # 10:15 UTC ~= 18:15 Taipei / 19:15 Tokyo
    - cron: '15 10 * * *'
    # 13:15 UTC ~= 21:15 Taipei / 22:15 Tokyo
    - cron: '15 13 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-predict
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      # CPBL is NOT fetched here — www.cpbl.com.tw blocks GitHub Actions'
      # published IP ranges (confirmed: 404 on every CPBL endpoint from this
      # runner, while the exact same requests succeed from a residential/
      # other-cloud IP). data/cpbl_*.json is instead kept fresh by a
      # Windows Task Scheduler job on the user's machine that pushes
      # straight to this repo — see scripts/update_cpbl_and_push.bat and the
      # README. This job just uses whatever CPBL data is currently in the
      # repo (possibly a few hours old, never older than ~8h given that
      # schedule) and fetches NPB fresh itself.
      #
      # Each fetcher below is independent and best-effort: a failure must
      # not block the others, and must never touch that source's existing
      # data/*.json — the fetcher only writes via a single json.dump() at
      # the very end of main(), so an exception mid-run leaves the prior
      # file untouched on disk automatically.
      - name: Fetch NPB schedule
        run: python scripts/fetch_npb.py
        continue-on-error: true
      - name: Fetch NPB player stats
        run: python scripts/fetch_npb_players.py
        continue-on-error: true

      # Locking is NOT best-effort in the same sense — a game_id, once
      # written, is never revisited, so this only locks games for a league
      # whose data is actually present and fresh enough this run (see
      # lock_predictions.py's own FileNotFoundError handling for the
      # degenerate case where a data file has never existed at all).
      - name: Lock today's predictions
        run: python pipeline/lock_predictions.py

      - name: Build full site + dashboard
        if: always()
        run: |
          python scripts/generate_site.py
          python pipeline/build_dashboard.py

      - name: Commit and push
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ predictions/ site/ docs/
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "daily predict: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase
            git push
          fi
